name: Deploy Komachi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-komachi.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication repository
        uses: actions/checkout@v4

      - name: Download verified Komachi web build
        run: curl -L --fail --silent --show-error 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-8d40-8209-b659-3ad4778adaad/raw?se=2026-09-06T06%3A32%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=01a07561-b0da-763d-9bd6-96fba5d75d8e&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T02%3A10%3A32Z&ske=2026-09-07T02%3A10%3A32Z&sks=b&skv=2026-02-06&sig=ep2CdROFPTivhNjdisYmq3%2BKzFHK/pgw4H0BlXQtuD0%3D' -o komachi-web.zip

      - name: Extract build
        run: |
          mkdir site
          unzip -q komachi-web.zip -d site
          test -f site/index.html
          test -f site/main.dart.js

      - name: Store finished web files
        run: |
          cp -a site/. .
          rm -f README.md komachi-web.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Komachi web build"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
